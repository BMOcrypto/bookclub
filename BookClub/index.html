<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Book Store</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <h1>Daily Book Recommendations</h1>
    <div id="book-list">
        <!-- Book entries will be inserted here -->
    </div>
    <script>
        // Fetch and display the latest book entry
        fetch('books/latest.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('book-list');
                const bookDiv = document.createElement('div');
                bookDiv.className = 'book-entry';
                bookDiv.innerHTML = `
                    <h2>${data.title}</h2>
                    <p><strong>Author:</strong> ${data.author}</p>
                    <p><strong>Published:</strong> ${data.publish_date}</p>
                    <img src="${data.cover_image}" alt="Book Cover">
                    <p>${data.summary}</p>
                    <a href="${data.amazon_link}" target="_blank">Buy on Amazon</a>
                `;
                container.appendChild(bookDiv);
            })
            .catch(error => {
                console.error('Error fetching the latest book:', error);
            });
    </script>
</body>
</html>
